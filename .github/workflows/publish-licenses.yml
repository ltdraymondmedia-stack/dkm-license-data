name: Publish signed licenses
on:
  push:
    branches: [main]
    paths: [private, sign_licenses.py, '.github/workflows/publish-licenses.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Sign license list
        env:
          DKM_RSA_PRIVATE_KEY: ${{ secrets.DKM_RSA_PRIVATE_KEY }}
        run: python sign_licenses.py
      - name: Commit generated licenses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add licenses.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update signed licenses'
            git push
          fi
